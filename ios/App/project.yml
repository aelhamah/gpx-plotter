name: GPXNav
options:
  bundleIdPrefix: com.aelhamah
  deploymentTarget:
    iOS: "17.0"
  minimumXcodeGenVersion: 2.46.0
  xcodeVersion: "26.2"
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.0.0
  RouteKit:
    path: ../RouteKit
targets:
  GPXNav:
    type: application
    platform: iOS
    # Spelled out rather than left to `bundleIdPrefix`, because this identifier is
    # now on Apple's allowlist and on a MapTiler key's allowlist: `com.example`
    # could not be registered at all, so it was a placeholder that had to go.
    PRODUCT_BUNDLE_IDENTIFIER: com.aelhamah.GPXNav
    sources:
      - GPXNav
      # The activity attributes and the command bus, which the widget extension
      # needs too. Two files, or they could not be shared: an app-extension
      # target cannot link the app, and a package for this would be a package
      # with two types in it.
      - Shared
    resources:
      - GPXNav/Resources
    dependencies:
      - package: MapLibre
        product: MapLibre
      - package: RouteKit
        product: RouteKit
      # Embeds the Live Activity. Without this the extension builds and ships
      # nothing, and `Activity.request` finds no widget to show.
      - target: GPXNavWidgets
        embed: true
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    # An explicit plist, not GENERATE_INFOPLIST_FILE. Xcode's generated plist
    # silently drops custom INFOPLIST_KEY_* names (MaptilerAPIKey never arrives,
    # even as a literal), so the key has to be a real plist entry where
    # $(MAPTILER_API_KEY) gets expanded. Note xcodegen *rewrites* this file on
    # every `generate`, so every key has to live under `properties` here.
    info:
      path: GPXNav/Info.plist
      properties:
        # xcodegen's stub hardcodes 1.0/1; the User-Agent version comes from
        # these, so they have to track the real build settings.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Without a launch screen iOS letterboxes the app into a legacy
        # compatibility window instead of using the full display.
        UILaunchScreen: {}
        # The app imports GPX through a document picker but could not show the
        # user what it already had: an app's Documents folder is invisible in
        # Files unless it opts in, so a file copied in — over AirDrop, or by hand
        # during testing — was unreachable even to the app's own picker.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: "GPXNav needs location to show your position on the map and for navigation."
        NSLocationAlwaysAndWhenInUseUsageDescription: "GPXNav needs background location for turn-by-turn navigation and off-course alerts."
        UIBackgroundModes:
          - location
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        # SlopeServer is served over loopback HTTP; see docs/ios-plan.md §6.
        NSAllowsLocalNetworking: true
        # Injected from MAPTILER_API_KEY in the gitignored Secrets.xcconfig.
        MaptilerAPIKey: $(MAPTILER_API_KEY)
    settings:
      base:
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        # A real version + build number. Without these the app's User-Agent
        # reads "GPXNav/(null) ... (NOT SET)", which is both wrong and
        # un-allowlistable on MapTiler.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        # Without this the target builds no icon at all and the app wears the
        # generic placeholder on the home screen. One 1024 universal slot is
        # enough — iOS scales it — and it is the same
        # `logo/platform/ios/AppIcon-1024.png` the web build rasterises from.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # From Secrets.local.xcconfig, so a personal team id never gets
        # committed. Empty means simulator-only; see docs/dev.md.
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    scheme:
      testTargets: []
  GPXNavWidgets:
    type: app-extension
    platform: iOS
    productName: GPXNavWidgets
    sources:
      - GPXNavWidgets
      - Shared
    # RouteKit for `Units` and `UnitSystem`, so the lock screen prints distances
    # through the same formatter as the app. Deliberately *not* a dependency on
    # GPXNav: an app-extension target cannot link the app, and xcodegen is happy
    # to write the dependency out for you — a build that fails at link time is a
    # worse way to learn that.
    dependencies:
      - package: RouteKit
        product: RouteKit
    # An explicit plist, for the same reason as the app's: `NSExtension` is a
    # dictionary, and a generated plist wants it spelled as a pile of
    # INFOPLIST_KEY_ overrides. This key is what makes the bundle a widget
    # extension at all.
    info:
      path: GPXNavWidgets/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true
    # The same config file as the app, so `$(DEVELOPMENT_TEAM)` resolves here too.
    # Without it the extension's team is empty, the extension does not sign, and
    # the build fails on the *widget* — which reads as a widget problem rather than
    # as a missing xcconfig.
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    settings:
      base:
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        # The id docs/ios-plan.md §12 settles on. It has to be the app's id with a
        # suffix, or the install fails with "Mismatched bundle IDs" — and xcodegen
        # will not do this for you: left alone it builds `bundleIdPrefix` + target
        # name.
        PRODUCT_BUNDLE_IDENTIFIER: com.aelhamah.GPXNav.GPXNavWidgets
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        # Inherited rather than empty: an extension that does not sign will not be
        # embedded, and `Activity.request` finds no widget to show on the device.
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        # No asset catalogue and no accent colour here on purpose: the widget's
        # colours are explicit (the map's trace cyan and the off-course orange),
        # so an accent slot would only be something to keep in sync.
    scheme:
      testTargets: []