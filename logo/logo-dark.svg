<g transform="translate(128 128) scale(0.64) translate(-128 -128)"><path d="M186.4 73.8Q189.6 66.4 182.3 69.6L73.7 116.3Q66.3 119.5 74.3 120.1L110.6 137.1Q118 140 120.8 147.5L133.7 182.2Q136.5 189.7 139.7 182.4Z" fill="#2E6BE6"/><path d="M186.4 73.8Q189.6 66.4 182.3 69.6L73.7 116.3Q66.3 119.5 74.3 120.1L110.6 137.1Q118 140 120.8 147.5L186.4 73.8Z" fill="#FFFFFF"/></g>
