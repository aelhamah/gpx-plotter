<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dark-title dark-desc">
<title id="dark-title">GPX Plotter</title>
<desc id="dark-desc">GPX Plotter, graphite tile, for the web</desc>
<defs>
<linearGradient id="dark-tile" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#2B2F35"/>
<stop offset="0.55" stop-color="#191C21"/>
<stop offset="1" stop-color="#0B0C0E"/>
</linearGradient>
<radialGradient id="dark-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(150 108) rotate(45) scale(140)">
<stop stop-color="#2E6BE6" stop-opacity="0.15"/>
<stop offset="1" stop-color="#2E6BE6" stop-opacity="0"/>
</radialGradient>
<linearGradient id="dark-sheen" x1="0" y1="0" x2="180" y2="200" gradientUnits="userSpaceOnUse">
