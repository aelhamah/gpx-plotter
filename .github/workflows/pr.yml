name: CI

# Builds and tests only the platforms a change touches. A web/ change runs the
# browser app, an ios/ change runs the native app, and a workflow change runs
# both because it can break either.
#
# `gate` is the only job that should be a required status check: the per-platform
# jobs are conditional and report as "skipped" when they do not apply, which is
# not a reliable required check.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed platforms
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      ios: ${{ steps.filter.outputs.ios }}
      ios_present: ${{ steps.probe.outputs.present }}
    steps:
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - 'web/**'
              - '.github/workflows/**'
            ios:
              - 'ios/**'
              - '.github/workflows/**'

      # A workflow-only change sets the ios filter, so the iOS job would try to
      # build a tree that does not exist yet. Probing here rather than with
      # hashFiles in the job's own `if` keeps it working, because hashFiles is
      # not available in a job-level condition.
      - name: Look for the iOS package
        uses: actions/checkout@v4
        with:
          sparse-checkout: ios/RouteKit
          sparse-checkout-cone-mode: false

      - name: Record whether ios/RouteKit is present
        id: probe
        env:
          SWIFT_PACKAGE: ${{ hashFiles('ios/RouteKit/Package.swift') }}
        run: |
          if [ -n "$SWIFT_PACKAGE" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

  web:
    name: Web (build + test)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run unit tests
        run: npm test

  ios:
    name: iOS (swift build + test)
    needs: changes
    # ios_present is false until RouteKit lands, so a workflow-only change does
    # not try to build a tree that does not exist.
    if: >-
      needs.changes.outputs.ios == 'true' &&
      needs.changes.outputs.ios_present == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios/RouteKit
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Build RouteKit
        run: swift build
      - name: Test RouteKit
        run: swift test

  gate:
    name: CI
    needs: [changes, web, ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a platform job failed
        env:
          WEB: ${{ needs.web.result }}
          IOS: ${{ needs.ios.result }}
        run: |
          status=0
          if [ "$WEB" = "failure" ] || [ "$IOS" = "failure" ]; then
            echo "A platform job failed (web=$WEB, ios=$IOS)."
            status=1
          elif [ "$WEB" = "cancelled" ] || [ "$IOS" = "cancelled" ]; then
            echo "A platform job was cancelled (web=$WEB, ios=$IOS)."
            status=1
          else
            echo "OK (web=$WEB, ios=$IOS)."
          fi
          exit "$status"
