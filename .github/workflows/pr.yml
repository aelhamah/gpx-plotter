name: CI

# Builds and tests only the platforms a change touches. A web/ change runs the
# browser app, an ios/ change runs the native app, and a workflow change runs
# both because it can break either.
#
# `gate` is the only job that should be a required status check: the per-platform
# jobs are conditional and report as "skipped" when they do not apply, which is
# not a reliable required check.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed platforms
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      ios: ${{ steps.filter.outputs.ios }}
      ios_present: ${{ steps.probe.outputs.present }}
    steps:
      # Required before the filter, not just for the probe below: on a push event
      # paths-filter diffs commits with git, so it needs the history. On a
      # pull_request event it uses the API instead and would have worked without
      # this, which is why the failure only showed up on main.
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - 'web/**'
              - '.github/workflows/**'
            ios:
              - 'ios/**'
              - '.github/workflows/**'

      # A workflow-only change sets the ios filter, so the iOS job would try to
      # build a tree that does not exist yet. Probing here rather than with
      # hashFiles in the job's own `if` keeps it working, because hashFiles is
      # not available in a job-level condition.
      - name: Record whether ios/RouteKit is present
        id: probe
        env:
          SWIFT_PACKAGE: ${{ hashFiles('ios/RouteKit/Package.swift') }}
        run: |
          if [ -n "$SWIFT_PACKAGE" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

  web:
    name: Web (build + test)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run unit tests
        run: npm test

  ios:
    name: iOS (swift build + test)
    needs: changes
    # ios_present is false until RouteKit lands, so a workflow-only change does
    # not try to build a tree that does not exist.
    if: >-
      needs.changes.outputs.ios == 'true' &&
      needs.changes.outputs.ios_present == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios/RouteKit
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Build RouteKit
        run: swift build
      - name: Test RouteKit
        run: swift test

  gate:
    name: CI
    needs: [changes, web, ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any upstream job failed or was cancelled
        env:
          CHANGES: ${{ needs.changes.result }}
          WEB: ${{ needs.web.result }}
          IOS: ${{ needs.ios.result }}
        run: |
          # `changes` has to be checked too. If it fails, both platform jobs are
          # skipped rather than failed, so a gate that only inspects web/ios
          # would report success for a run that tested nothing at all.
          status=0
          for job in "changes:$CHANGES" "web:$WEB" "ios:$IOS"; do
            name=${job%%:*}
            result=${job#*:}
            case "$result" in
              failure)
                echo "::error::$name failed"
                status=1
                ;;
              cancelled)
                echo "::error::$name was cancelled"
                status=1
                ;;
            esac
          done
          if [ "$status" -eq 0 ]; then
            echo "All applicable jobs passed (changes=$CHANGES, web=$WEB, ios=$IOS)."
          else
            echo "Failed (changes=$CHANGES, web=$WEB, ios=$IOS)."
          fi
          exit "$status"
