name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# The thing being contended is the single gh-pages branch, which PR previews write
# to as well. Serialise on that, not on "main deploys": merging a pull request
# fires this workflow (push to main) and the preview cleanup (pull_request closed)
# at the same moment, and both push to gh-pages.
#
# cancel-in-progress is off on purpose. A preview must never cancel a production
# deploy midway, and cancelling a publish that is already pushing leaves gh-pages
# in neither the old nor the new state. Runs queue instead; a deploy takes about
# half a minute, so the wait is shorter than the recovery from a lost site.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_MAPTILER_API_KEY: ${{ secrets.VITE_MAPTILER_API_KEY }}

      - name: Publish to gh-pages (site root)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/dist
          keep_files: true
          commit_message: "Deploy main to site root"
