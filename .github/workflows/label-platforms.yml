name: Label platforms

# Adds a `web` and/or `ios` label to each PR based on the files it touches, and
# removes a label when a push stops touching that platform.
#
# This lives in its own workflow, separate from the CI build, on purpose. It
# needs a write token to set labels, which means `pull_request_target`, which
# also means a write-scoped GITHUB_TOKEN and access to repository secrets. The
# rule is simple: a `pull_request_target` workflow must never check out or
# execute pull request code. This one only reads the changed-file list through
# the GitHub API and calls the issues API.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label platforms
    runs-on: ubuntu-latest
    steps:
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - 'web/**'
              - '.github/workflows/**'
            ios:
              - 'ios/**'
              - '.github/workflows/**'

      - name: Create the platform labels if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Checked rather than `gh label create ... || true`, so that a genuine
          # failure surfaces here instead of as a confusing "label not found"
          # from the step below.
          ensure() {
            if ! gh label list --repo "$REPO" --limit 100 --json name \
              --jq '.[].name' | grep -qx "$1"; then
              gh label create "$1" --repo "$REPO" --color "$2" --description "$3"
            fi
          }
          ensure web 1D76DB "Touches the web app in web/"
          ensure ios 555555 "Touches the native iOS app in ios/"

      - name: Sync the labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          WEB: ${{ steps.filter.outputs.web }}
          IOS: ${{ steps.filter.outputs.ios }}
        run: |
          # --repo is required: `gh` otherwise infers the repository from the git
          # checkout, and this job deliberately has none, since checking out pull
          # request code under pull_request_target would expose repo secrets.
          #
          # Move each label to the state this push actually implies, rather than
          # only ever adding, so a PR that stops touching ios loses the label.
          if [ "$WEB" = "true" ]; then
            gh pr edit "$PR" --repo "$REPO" --add-label web > /dev/null
          else
            gh pr edit "$PR" --repo "$REPO" --remove-label web > /dev/null 2>&1 || true
          fi
          if [ "$IOS" = "true" ]; then
            gh pr edit "$PR" --repo "$REPO" --add-label ios > /dev/null
          else
            gh pr edit "$PR" --repo "$REPO" --remove-label ios > /dev/null 2>&1 || true
          fi
